name: Philosophy MCP
on:
  pull_request:
    paths:
      - 'services/philosophy-mcp/**'
      - '.github/workflows/philosophy-mcp.yml'
  push:
    paths:
      - 'services/philosophy-mcp/**'
      - '.github/workflows/philosophy-mcp.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/philosophy-mcp/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: services/philosophy-mcp
